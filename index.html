<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Lobby 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Free Fire UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Giữ tương tác xoay 3D bên dưới */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 5px;
            border-left: 4px solid #ff9900;
            color: #fff;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #ff9900;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #000;
        }

        .name {
            font-weight: bold;
            font-size: 14px;
        }

        .level {
            font-size: 11px;
            color: #ffcc00;
        }

        .currencies {
            display: flex;
            gap: 15px;
        }

        .currency-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .currency-gold { color: #ffd700; }
        .currency-diamond { color: #00ffff; }

        /* Left Menu Placeholder */
        .left-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .menu-btn {
            width: 120px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ccc;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            border-radius: 4px;
            text-align: left;
            padding-left: 15px;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 0 100%);
        }

        /* Start Button Section */
        .bottom-right {
            align-self: flex-end;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .mode-select {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border-right: 3px solid #ff9900;
        }

        .start-btn {
            background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);
            color: #fff;
            font-size: 22px;
            font-weight: 900;
            padding: 15px 45px;
            border: none;
            border-radius: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            letter-spacing: 2px;
        }

        /* Instruction overlay */
        .instruction {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
    </style>

    <!-- Import Three.js và GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Giả Lập Free Fire (Chỉ để trang trí) -->
    <div class="ui-layer">
        <div class="top-bar">
            <div class="player-info">
                <div class="avatar">FF</div>
                <div>
                    <div class="name">SURVIVOR</div>
                    <div class="level">Lv. 60</div>
                </div>
            </div>
            <div class="currencies">
                <div class="currency-item currency-gold">🪙 99,999</div>
                <div class="currency-item currency-diamond">💎 1,250</div>
            </div>
        </div>

        <div class="left-menu">
            <div class="menu-btn">Shop</div>
            <div class="menu-btn">Vòng Quay</div>
            <div class="menu-btn">Nhân Vật</div>
            <div class="menu-btn">Tủ Đồ</div>
            <div class="menu-btn">Vũ Khí</div>
            <div class="menu-btn">Thẻ Vô Cực</div>
        </div>

        <div class="bottom-right">
            <div class="mode-select">BẢO AN 🎯 [ BÁN ĐẢO ]</div>
            <button class="start-btn">BẮT ĐẦU</button>
        </div>

        <div class="instruction">Xoay chuột/vuốt để xoay mô hình 360°</div>
    </div>

    <script>
        // --- CẤU HÌNH THREE.JS ---
        const container = document.getElementById('canvas-container');

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a10, 0.03); // Sương mù tạo không khí sảnh

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // Control xoay 360 độ
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05; // Giới hạn không cho xoay xuống dưới sàn
        controls.minDistance = 2;
        controls.maxDistance = 10;
        controls.target.set(0, 1, 0);

        // --- ÁNH SÁNG SẢNH (FF VIBE) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // Đèn chiếu chính
        const dirLight = new THREE.DirectionalLight(0xffaa44, 2.0);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Đèn viền (Rim Light) màu xanh neon tạo hiệu ứng FF
        const rimLight = new THREE.DirectionalLight(0x00ffff, 1.5);
        rimLight.position.set(-5, 5, -5);
        scene.add(rimLight);

        // Đèn điểm dưới chân
        const pointLight = new THREE.PointLight(0xff6600, 2, 8);
        pointLight.position.set(0, 0.2, 0);
        scene.add(pointLight);

        // --- BỀ MẶT SÀN SẢNH 3D ---
        const floorGeo = new THREE.CylinderGeometry(4, 4.5, 0.2, 32);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x111118, 
            roughness: 0.2, 
            metalness: 0.8 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.1;
        floor.receiveShadow = true;
        scene.add(floor);

        // Vòng tròn sáng nền dưới chân
        const ringGeo = new THREE.RingGeometry(1.8, 2.0, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff6600, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.01;
        scene.add(ring);

        // --- KHỐI VUÔNG MẶC ĐỊNH & XỬ LÝ MODEL 3D ---
        let targetObject = null;

        // Tạo khối vuông mặc định trước
        function createDefaultCube() {
            const cubeGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const cubeMat = new THREE.MeshStandardMaterial({ 
                color: 0xff8800, 
                metalness: 0.5, 
                roughness: 0.2 
            });
            const cube = new THREE.Mesh(cubeGeo, cubeMat);
            cube.position.set(0, 1, 0);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);
            return cube;
        }

        targetObject = createDefaultCube();

        // Tự động tìm và tải Model 3D nếu tệp tồn tại
        const loader = new THREE.GLTFLoader();
        
        // Thử tải cả định dạng .glb hoặc .gltf
        const modelFileName = 'holy_dragon_arena_of_valor.glb'; 

        loader.load(
            modelFileName,
            function (gltf) {
                // Xóa khối vuông mặc định
                if (targetObject) {
                    scene.remove(targetObject);
                }

                const model = gltf.scene;
                
                // Căn chỉnh kích thước và vị trí model tự động
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // Đưa model về tâm mặt đất
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y) + (size.y / 2);
                model.position.z += (model.position.z - center.z);

                // Bật bóng đổ cho model
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);
                targetObject = model;
                console.log('Tải Model 3D thành công!');
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + '% đã tải');
            },
            function (error) {
                console.warn('Không tìm thấy file model custom hoặc lỗi định dạng. Đang dùng khối vuông mặc định.');
            }
        );

        // --- RENDER LOOP & ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);

            // Cập nhật điều khiển góc xoay
            controls.update();

            // Render khung hình
            renderer.render(scene, camera);
        }

        animate();

        // --- TỰ ĐỘNG THÍCH ỨNG KÍCH THƯỚC MÀN HÌNH ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
