const ACCOUNT_KEY = "GERMAIN_FC_ACCOUNT";
const BACKUP_KEY = "GERMAIN_FC_BACKUP";

function openAccount() {
    document.getElementById("account-modal").style.display = "flex";
    updateAccountUI();
}

function closeAccount() {
    document.getElementById("account-modal").style.display = "none";

function showMessage(message) {

// MÃ HÓA MẬT KHẨU BẰNG SHA-256
async function hashPassword(password) {
    if (!window.crypto || !crypto.subtle) {
        throw new Error("Trình duyệt cần HTTPS hoặc localhost để tạo tài khoản an toàn hơn.");
    }

    const data = new TextEncoder().encode(password);
    const hash = await crypto.subtle.digest("SHA-256", data);

    return Array.from(new Uint8Array(hash))
        .map(byte => byte.toString(16).padStart(2,"0"))
        .join("");
}

// TẠO TÀI KHOẢN
async function createAccount() {

    const username =
        document.getElementById("account-username").value.trim();

    const email =
        document.getElementById("account-email").value.trim();

    const password =
        document.getElementById("account-password").value;

    if (!username || !email || !password) {
        showMessage("Vui lòng nhập đầy đủ thông tin!");
        return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage("Email không hợp lệ!");
        return;
    }

    if (password.length < 8) {
        showMessage("Mật khẩu phải có ít nhất 8 ký tự!");
        return;
    }

    if (localStorage.getItem(ACCOUNT_KEY)) {
        showMessage("Thiết bị này đã có tài khoản!");
        return;
    }

    try {
        const passwordHash = await hashPassword(password);

        const account = {
            username: username,
            email: email,
            passwordHash: passwordHash,
            createdAt: new Date().toISOString()
        };

        localStorage.setItem(
            ACCOUNT_KEY,
            JSON.stringify(account)
        );

        backupGame();

        updateAccountUI();

        showMessage("Tạo tài khoản và sao lưu thành công!");

    } catch (error) {
        showMessage(error.message);
    }
}
